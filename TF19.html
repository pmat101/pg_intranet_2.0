    <style>

  </head>
  <body>

    <script>
      let rowCounters = { eia: 0, faeA: 0, faeB: 0, faa: 0, team: 0 };
      let isSubmitting = false;

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function optionsHtml(list, placeholder) {
        const first = placeholder
          ? `<option value="">${escapeHtml(placeholder)}</option>`
          : "";
        return (
          first +
          (list || [])
            .map(
              (v) =>
                `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`,
            )
            .join("")
        );
      }

      function setSelect(id, list, placeholder) {
        const el = document.getElementById(id);
        if (!el) return;
        el.innerHTML = optionsHtml(list, placeholder);
      }

      function addRow(containerId, prefix, title) {
        rowCounters[prefix] += 1;
        const index = rowCounters[prefix];
        const wrap = document.getElementById(containerId);
        const div = document.createElement("div");
        div.className = "row-wrap";
        div.dataset.prefix = prefix;
        div.dataset.index = String(index);

        // EIA section: Name + Assistant name + Assistant email (no Functional Area per spec)
        // All other sections: Name + Functional Area
        if (prefix === "eia") {
          div.innerHTML = `
            <div class="row-head">
              <div class="row-title">${title} #${index}</div>
              <div class="inline-actions">
                <button type="button" class="btn-mini danger" onclick="removeRow(this)">Remove</button>
              </div>
            </div>
            <div class="people-grid">
              <div class="form-group">
                <label class="form-label">EIA Coordinator Name</label>
                <select data-field="name" data-prefix="${prefix}" data-index="${index}"></select>
              </div>
              <div class="form-group">
                <label class="form-label">Assistant to EIA coordinator</label>
                <input type="text" data-field="assistant_name" data-prefix="${prefix}" data-index="${index}" placeholder="Assistant name" />
              </div>
            </div>
            <div class="people-grid" style="margin-top:12px;">
              <div class="form-group">
                <label class="form-label">Assistant EIA coordinator email</label>
                <input type="email" data-field="assistant_email" data-prefix="${prefix}" data-index="${index}" placeholder="assistant@example.com" />
              </div>
              <div class="form-group"></div>
            </div>
          `;
        } else {
          div.innerHTML = `
            <div class="row-head">
              <div class="row-title">${title} #${index}</div>
              <div class="inline-actions">
                <button type="button" class="btn-mini danger" onclick="removeRow(this)">Remove</button>
              </div>
            </div>
            <div class="people-grid">
              <div class="form-group">
                <label class="form-label">Name</label>
                <select data-field="name" data-prefix="${prefix}" data-index="${index}"></select>
              </div>
              <div class="form-group">
                <label class="form-label">Functional Area</label>
                <select data-field="functional_area" data-prefix="${prefix}" data-index="${index}"></select>
              </div>
            </div>
          `;
        }

        wrap.appendChild(div);
        initializeRowFields(prefix, index);
      }

      function removeRow(btn) {
        const wrap = btn.closest(".row-wrap");
        if (wrap) wrap.remove();
      }

      function initializeRowFields(prefix, index) {
        const row = document.querySelector(
          `.row-wrap[data-prefix="${prefix}"][data-index="${index}"]`,
        );
        if (!row) return;

        const nameSelect = row.querySelector('select[data-field="name"]');
        if (nameSelect) {
          if (prefix === "eia")
            nameSelect.innerHTML = optionsHtml(
              window.eiaCoordinator || [],
              "Select",
            );
          if (prefix === "faeA")
            nameSelect.innerHTML = optionsHtml(window.faeCatA || [], "Select");
          if (prefix === "faeB")
            nameSelect.innerHTML = optionsHtml(window.faeCatB || [], "Select");
          if (prefix === "faa")
            nameSelect.innerHTML = optionsHtml(window.faa || [], "Select");
          if (prefix === "team")
            nameSelect.innerHTML = optionsHtml(window.tmToFAE || [], "Select");
        }

        const faSelect = row.querySelector(
          'select[data-field="functional_area"]',
        );
        if (faSelect) {
          faSelect.innerHTML = optionsHtml(
            window.functionalArea || [],
            "Select",
          );
        }
      }

      function addEiaRow() {
        addRow("eia_rows", "eia", "EIA Coordinator");
      }
      function addFaeARow() {
        addRow("faeA_rows", "faeA", "Category A FAE");
      }
      function addFaeBRow() {
        addRow("faeB_rows", "faeB", "Category B FAE");
      }
      function addFaaRow() {
        addRow("faa_rows", "faa", "FAA");
      }
      function addTeamMemberRow() {
        addRow("team_rows", "team", "Team Member");
      }

      function gatherRows(prefix) {
        const rows = [];
        document
          .querySelectorAll(`.row-wrap[data-prefix="${prefix}"]`)
          .forEach((wrap) => {
            const obj = {};
            wrap.querySelectorAll("[data-field]").forEach((el) => {
              const field = el.dataset.field;
              obj[field] = el.value || "";
            });
            rows.push(obj);
          });
        return rows;
      }

      function validateTF19(p) {
        const missing = [];
        if (!p.official_email) missing.push("Official Email ID of requestor");
        if (!p.pcode) missing.push("PCODE");

        const groups = [
          {
            rows: p.eia_rows,
            label:
              "Details of EIA Coordinators & Assistants to EIA Coordinators",
            kind: "eia",
          },
          {
            rows: p.faeA_rows,
            label: "Details for Category A FAEs",
            kind: "fa",
          },
          {
            rows: p.faeB_rows,
            label: "Details for Category B FAEs",
            kind: "fa",
          },
          { rows: p.faa_rows, label: "Details of FAA", kind: "fa" },
          { rows: p.team_rows, label: "Details of Team members", kind: "fa" },
        ];

        // Validate only rows that have been partially filled.
        // Entirely-empty sections are allowed.
        groups.forEach((g) => {
          const usable = (g.rows || []).filter((r) =>
            Object.values(r).some((v) => String(v || "").trim()),
          );
          usable.forEach((r, idx) => {
            if (!String(r.name || "").trim())
              missing.push(`${g.label} - Name (row ${idx + 1})`);
            if (g.kind === "fa") {
              if (!String(r.functional_area || "").trim())
                missing.push(`${g.label} - Functional Area (row ${idx + 1})`);
            }
          });
        });
        return missing;
      }

      function submitTF19() {
        if (isSubmitting) return;
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          requestor_first_name: document.getElementById("requestor_first_name")
            .value,
          requestor_last_name: document.getElementById("requestor_last_name")
            .value,
          official_email: document.getElementById("official_email").value,
          client_name: document.getElementById("client_name").value,
          project_name: document.getElementById("project_name").value,
          site_address_line1:
            document.getElementById("site_address_line1").value,
          site_address_line2:
            document.getElementById("site_address_line2").value,
          site_city: document.getElementById("site_city").value,
          site_state: document.getElementById("site_state").value,
          site_zipcode: document.getElementById("site_zipcode").value,
          site_country: document.getElementById("site_country").value,
          pcode: document.getElementById("pcode").value,
          team_name: document.getElementById("team_name").value,
          sector: Array.from(document.getElementById("sector").selectedOptions)
            .map((o) => o.value)
            .join(", "),
          category: document.getElementById("category").value,
          type_of_work: document.getElementById("type_of_work").value,
          eac_name: document.getElementById("eac_name").value,
          stage_of_case: document.getElementById("stage_of_case").value,
          project_sheet_link:
            document.getElementById("project_sheet_link").value,
          kml_link: document.getElementById("kml_link").value,
          target_date_for_review: document.getElementById(
            "target_date_for_review",
          ).value,
          initial_pages_word_link: document.getElementById(
            "initial_pages_word_link",
          ).value,
          initial_pages_pdf_link: document.getElementById(
            "initial_pages_pdf_link",
          ).value,
          signed_copy_initial_pages_url: document.getElementById(
            "signed_copy_initial_pages_url",
          ).value,
          remarks: document.getElementById("remarks").value,
          eia_rows: gatherRows("eia"),
          faeA_rows: gatherRows("faeA"),
          faeB_rows: gatherRows("faeB"),
          faa_rows: gatherRows("faa"),
          team_rows: gatherRows("team"),
        };

        const missing = validateTF19(payload);
        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitTF19(payload);
      }

      window.addEventListener("DOMContentLoaded", function () {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            setSelect("site_country", data.state || [], "Select");
            setSelect("team_name", data.team || [], "Select");
            setSelect("sector", data.sector || [], null);
            setSelect("category", data.category || [], "Select");
            setSelect("type_of_work", data.workType || [], "Select");
            setSelect("eac_name", data.eac || [], "Select");

            window.eiaCoordinator = data.eiaCoordinator || [];
            window.faeCatA = data.faeCatA || [];
            window.faeCatB = data.faeCatB || [];
            window.faa = data.faa || [];
            window.tmToFAE = data.tmToFAE || [];
            window.functionalArea = data.functionalArea || [];

            addEiaRow();
            addFaeARow();
            addFaeBRow();
            addFaaRow();
            addTeamMemberRow();
          })
          .getDropdownData();
      });
    </script>
  </body>
