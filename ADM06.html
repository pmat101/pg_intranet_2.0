<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADM06</title>
    <?!= HtmlService.createHtmlOutputFromFile('shared-styles').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">ADM06</div>
      <div class="form-subtitle">Hotspot Requirement Details Form</div>

      <div class="form-section">
        <div class="form-group">
          <label class="form-label" for="date">Date</label>
          <input type="date" id="date" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label">Requestor Name</label>
          <div class="form-row">
            <div class="form-col">
              <input
                type="text"
                id="requestor_first_name"
                placeholder="First Name"
              />
              <div class="helper-text">First Name</div>
            </div>
            <div class="form-col">
              <input
                type="text"
                id="requestor_last_name"
                placeholder="Last Name"
              />
              <div class="helper-text">Last Name</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="requestor_email"
            >Requestor Email ID <span class="required">*</span></label
          >
          <input type="email" id="requestor_email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="team_name">Team Name</label>
          <select id="team_name"></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="purpose_of_hotspot_requirement"
            >Purpose of Hotspot Requirement</label
          >
          <input type="text" id="purpose_of_hotspot_requirement" />
        </div>

        <div class="form-group">
          <label class="form-label" for="hotspot_required_from_date"
            >Hotspot required from date</label
          >
          <input type="date" id="hotspot_required_from_date" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="hotspot_required_till_date"
            >Hotspot required till date</label
          >
          <input type="date" id="hotspot_required_till_date" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="remarks">Remarks (if any)</label>
          <textarea id="remarks"></textarea>
        </div>
      </div>

      <button
        class="btn-primary"
        type="button"
        id="submitBtn"
        onclick="submitADM06()"
      >
        Submit
      </button>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function validateADM06(p) {
        const missing = [];
        if (!p.requestor_email) missing.push("Requestor Email ID");
        if (!p.team_name) missing.push("Team Name");
        if (!p.purpose_of_hotspot_requirement)
          missing.push("Purpose of Hotspot Requirement");
        if (!p.hotspot_required_from_date)
          missing.push("Hotspot required from date");
        if (!p.hotspot_required_till_date)
          missing.push("Hotspot required till date");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      let isSubmitting = false;

      function submitADM06() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          requestor_first_name: document.getElementById("requestor_first_name")
            .value,
          requestor_last_name: document.getElementById("requestor_last_name")
            .value,
          requestor_email: document.getElementById("requestor_email").value,
          team_name: document.getElementById("team_name").value,
          purpose_of_hotspot_requirement: document.getElementById(
            "purpose_of_hotspot_requirement",
          ).value,
          hotspot_required_from_date: document.getElementById(
            "hotspot_required_from_date",
          ).value,
          hotspot_required_till_date: document.getElementById(
            "hotspot_required_till_date",
          ).value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateADM06(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitADM06(payload);
      }
    </script>
  </body>
</html>
