    <script>
      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
        bindConditionalBlocks();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("gst-treatment"),
              data.gstTreatment || [],
              "-Select-",
            );
            fillSelect(
              document.getElementById("pr-mode"),
              data.prMode || [],
              "-Select-",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";

        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "-Select-";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      function bindConditionalBlocks() {
        bindYesNoBlock("gst-available", "gst-number-wrap", "gst-number");
        bindYesNoBlock("pan-available", "pan-number-wrap", "pan-number");
        bindYesNoBlock("tan-available", "tan-number-wrap", "tan-number");
      }

      function bindYesNoBlock(radioName, wrapId, inputId) {
        const radios = document.querySelectorAll(`input[name="${radioName}"]`);
        const wrap = document.getElementById(wrapId);
        const input = document.getElementById(inputId);

        function sync() {
          const value = getRadioValue(radioName);
          const show = value === "YES";
          wrap.style.display = show ? "block" : "none";
          if (!show) input.value = "";
        }

        radios.forEach(function (radio) {
          radio.addEventListener("change", sync);
        });

        sync();
      }

      function readNumber(id) {
        const value = document.getElementById(id).value;
        return value === "" ? "" : Number(value);
      }

      function validateBD02(payload) {
        const missing = [];

        if (!payload.leadDate)
          missing.push("Date of Client's Mail/ Lead Generation");
        if (!payload.officialEmail) missing.push("Official Email ID");
        if (!payload.customerCompany)
          missing.push("Customer's Company Legal Name");
        if (!payload.projectName) missing.push("Project Name");
        if (!payload.projectLocation) missing.push("Project Location");
        if (!payload.pcode) missing.push("P CODE");
        if (!payload.salesOrderLink) missing.push("Link to sales order");
        if (!payload.costComputerLink) missing.push("Link to Cost Computer");
        if (!payload.finalProposalLink) missing.push("Link to final proposal");

        if (payload.gstAvailable === "YES" && !payload.gstNumber)
          missing.push("GST number");
        if (payload.panAvailable === "YES" && !payload.panNumber)
          missing.push("PAN number");
        if (payload.tanAvailable === "YES" && !payload.tanNumber)
          missing.push("TAN number");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }

        return true;
      }

      let isSubmitting = false;

      function submitBD02() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          leadDate: document.getElementById("lead-date").value,
          formFillerFirstName: document.getElementById("form-filler-first-name")
            .value,
          formFillerLastName: document.getElementById("form-filler-last-name")
            .value,
          officialEmail: document.getElementById("official-email").value,
          customerCompany: document.getElementById("customer-company").value,
          customerFirstName: document.getElementById("customer-first-name")
            .value,
          customerLastName: document.getElementById("customer-last-name").value,
          customerContactCode: document.getElementById("customer-contact-code")
            .value,
          customerContactNumber: document.getElementById(
            "customer-contact-number",
          ).value,
          customerEmail: document.getElementById("customer-email").value,

          gstAvailable: getRadioValue("gst-available"),
          gstNumber: document.getElementById("gst-number").value,
          panAvailable: getRadioValue("pan-available"),
          panNumber: document.getElementById("pan-number").value,
          tanAvailable: getRadioValue("tan-available"),
          tanNumber: document.getElementById("tan-number").value,

          projectName: document.getElementById("project-name").value,
          projectLocation: document.getElementById("project-location").value,
          proposalId: document.getElementById("proposal-id").value,
          pcode: document.getElementById("pcode").value,
          dateProposalSent: document.getElementById("date-proposal-sent").value,
          gstTreatment: document.getElementById("gst-treatment").value,
          proposalTrendsSummaryLink: document.getElementById(
            "proposal-trends-summary-link",
          ).value,
          dateProposalWon: document.getElementById("date-proposal-won").value,
          workOrderLink: document.getElementById("work-order-link").value,
          salesOrderLink: document.getElementById("sales-order-link").value,
          costComputerLink: document.getElementById("cost-computer-link").value,
          finalProposalLink: document.getElementById("final-proposal-link")
            .value,
          prR: document.getElementById("pr-r").value,
          prB: document.getElementById("pr-b").value,
          travellingExpensesInScope: document.getElementById(
            "travelling-expenses-in-scope",
          ).value,

          overheadCosts: readNumber("overhead-costs"),
          testingCharges: readNumber("testing-charges"),
          adminExpenses: readNumber("admin-expenses"),
          manpowerCosts: readNumber("manpower-costs"),
          outsourcingCosts: readNumber("outsourcing-costs"),
          commissions: readNumber("commissions"),
          outsourcedManpower: readNumber("outsourced-manpower"),
          secondaryDataCosts: readNumber("secondary-data-costs"),
          contingencyCosts: readNumber("contingency-costs"),
          siteVisitCosts: readNumber("site-visit-costs"),
          projectBaseLevelCost: readNumber("project-base-level-cost"),
          finalQuoteValue: readNumber("final-quote-value"),
          percentageMargin: readNumber("percentage-margin"),
          prMode: document.getElementById("pr-mode").value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateBD02(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitBD02(payload);
      }
    </script>
