      <button

    <script>
      let isSubmitting = false;

      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
            fillSelect(
              document.getElementById("category"),
              data.category || ["A", "B1", "B2"],
              "Select",
            );
            fillSelect(
              document.getElementById("eac_name"),
              data.eac || [],
              "Select",
            );
            fillSelect(
              document.getElementById("type_of_project"),
              data.fq04TypeOfProject || ["New", "Expansion", "Product Mix"],
              "Select",
            );
            fillSelect(
              document.getElementById("country"),
              data.country || ["India"],
              "Select",
            );
            fillMultiSelect(
              document.getElementById("sector"),
              data.sector || [],
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function fillMultiSelect(select, items) {
        if (!select) return;
        select.innerHTML = "";
        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function getSelectedMultiValues(id) {
        const el = document.getElementById(id);
        return Array.from(el.selectedOptions)
          .map((opt) => opt.value)
          .join(", ");
      }

      function validateFQ04(p) {
        const missing = [];

        if (!p.requestor_email) missing.push("Official Email ID of Requestor");
        if (!p.team_name) missing.push("Team Name");
        if (!p.company_name) missing.push("Company Name");
        if (!p.project_name) missing.push("Name of the project");
        if (!p.pcode) missing.push("PCODE");
        if (!p.type_of_project) missing.push("Type of Project");
        if (!p.type_of_industry) missing.push("Type of Industry");
        if (!p.total_land_area_m2) missing.push("Total Land Area");
        if (!p.green_belt_area_m2) missing.push("Green Belt Area");
        if (!p.existing_storage_area_m2) missing.push("Existing Storage Area");
        if (!p.proposed_storage_area_m2) missing.push("Proposed Storage Area");
        if (!p.pfr_or_eia_report_url) missing.push("PFR Report/EIA report");
        if (!p.kml_file_url) missing.push("KML file");
        if (!p.msds_safety_datasheet_url)
          missing.push("MSDS/safety datasheet of Hazardous chemical");
        if (!p.applicable_tor_details_url)
          missing.push("Applicable TOR Details");
        if (!p.manufacturing_process_details_url)
          missing.push("Mnaufacturing/Process details");
        if (!p.process_flow_charts_pid_url)
          missing.push("Process Flow charts/ P&IDs");
        if (!p.layout_of_plant_url) missing.push("Layout of the Plant");
        if (!p.list_of_hazardous_chemical_handled)
          missing.push("List of Hazardous Chemical handled");
        if (!p.list_of_solvents_handled)
          missing.push("List of Solvents handled");
        if (!p.project_sheet_url) missing.push("Link to Project Sheet");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      function submitFQ04() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          requestor_first_name: document.getElementById("requestor_first_name")
            .value,
          requestor_last_name: document.getElementById("requestor_last_name")
            .value,
          requestor_email: document.getElementById("requestor_email").value,
          team_name: document.getElementById("team_name").value,
          company_name: document.getElementById("company_name").value,
          project_name: document.getElementById("project_name").value,
          pcode: document.getElementById("pcode").value,
          category: document.getElementById("category").value,
          sector: getSelectedMultiValues("sector"),
          eac_name: document.getElementById("eac_name").value,
          type_of_project: document.getElementById("type_of_project").value,
          type_of_industry: document.getElementById("type_of_industry").value,
          address_line1: document.getElementById("address_line1").value,
          address_line2: document.getElementById("address_line2").value,
          city: document.getElementById("city").value,
          state: document.getElementById("state").value,
          postal_code: document.getElementById("postal_code").value,
          country: document.getElementById("country").value,
          total_land_area_m2:
            document.getElementById("total_land_area_m2").value,
          green_belt_area_m2:
            document.getElementById("green_belt_area_m2").value,
          existing_storage_area_m2: document.getElementById(
            "existing_storage_area_m2",
          ).value,
          proposed_storage_area_m2: document.getElementById(
            "proposed_storage_area_m2",
          ).value,
          manpower_details: document.getElementById("manpower_details").value,
          pfr_or_eia_report_url: document.getElementById(
            "pfr_or_eia_report_url",
          ).value,
          kml_file_url: document.getElementById("kml_file_url").value,
          msds_safety_datasheet_url: document.getElementById(
            "msds_safety_datasheet_url",
          ).value,
          applicable_tor_details_url: document.getElementById(
            "applicable_tor_details_url",
          ).value,
          manufacturing_process_details_url: document.getElementById(
            "manufacturing_process_details_url",
          ).value,
          process_flow_charts_pid_url: document.getElementById(
            "process_flow_charts_pid_url",
          ).value,
          layout_of_plant_url: document.getElementById("layout_of_plant_url")
            .value,
          layout_of_storage_area_url: document.getElementById(
            "layout_of_storage_area_url",
          ).value,
          list_of_hazardous_chemical_handled: document.getElementById(
            "list_of_hazardous_chemical_handled",
          ).value,
          list_of_solvents_handled: document.getElementById(
            "list_of_solvents_handled",
          ).value,
          project_sheet_url: document.getElementById("project_sheet_url").value,
          existing_hazop_report: document.getElementById(
            "existing_hazop_report",
          ).value,
          existing_qra_report: document.getElementById("existing_qra_report")
            .value,
          existing_fire_fighting_system_details: document.getElementById(
            "existing_fire_fighting_system_details",
          ).value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateFQ04(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitFQ04(payload);
      }
    </script>
