          <div class="form-col">
            <label class="form-label" for="date_of_departure"

        <div

          <label class="form-label" for="conference_room_dates"

          <label class="check-chip"
            ><input
              type="checkbox"

          <label class="check-chip"

            Vehicle</label

        <div id="hotel_block" class="conditional-block">

              <input type="text" id="hotel_guest_name" />

            <div class="form-row">
              <div class="form-col">
                <label class="form-label" for="hotel_check_in_date"
                  >Check-in Date <span class="required">*</span></label
                >
                <input type="date" id="hotel_check_in_date" />
              </div>
              <div class="form-col">
                <label class="form-label" for="hotel_check_out_date"
                  >Check-out Date <span class="required">*</span></label
                >
                <input type="date" id="hotel_check_out_date" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="hotel_payment_due_by"

              <select id="hotel_payment_due_by">

                >
                <select id="food_meal_type">

              </div>
              <div class="form-col">
                <label class="form-label" for="food_date"
                  >Date for Food Arrangements

                >
                <input type="date" id="food_date" />

              <label class="form-label" for="food_no_of_clients"

        <div id="vehicle_block" class="conditional-block">

              <div class="form-col">
                <label class="form-label" for="vehicle_end_date"
                  >Vehicle Requirement End Date
                  <span class="required">*</span></label
                >
                <input type="date" id="vehicle_end_date" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-col">
                <label class="form-label" for="vehicle_no_of_visitors"
                  >Number of Visitors <span class="required">*</span></label
                >
                <input type="number" id="vehicle_no_of_visitors" min="0" />
              </div>
              <div class="form-col">
                <label class="form-label" for="vehicle_pickup_time"
                  >Pickup Time <span class="required">*</span></label
                >
                <input type="time" id="vehicle_pickup_time" />
              </div>

            <div class="form-group">
              <label class="form-label" for="vehicle_pickup_point"
                >Pickup Point <span class="required">*</span></label

      <button
        class="btn-primary"

      >
        Submit

    <script>
      let isSubmitting = false;

      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
        bindConferenceRoomToggle();
        bindRequirementToggles();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function bindConferenceRoomToggle() {
        const select = document.getElementById("conference_room_required");
        const wrap = document.getElementById("conference_room_dates_wrap");
        const input = document.getElementById("conference_room_dates");

        function sync() {
          const show = String(select.value || "").toLowerCase() === "yes";
          wrap.style.display = show ? "block" : "none";
          if (!show) input.value = "";
        }

        select.addEventListener("change", sync);
        sync();
      }

      function bindRequirementToggles() {
        const map = [
          { box: "req_hotel", block: "hotel_block" },
          { box: "req_food", block: "food_block" },
          { box: "req_vehicle", block: "vehicle_block" },
        ];

        map.forEach(function (m) {
          const box = document.getElementById(m.box);
          const block = document.getElementById(m.block);
          function sync() {
            block.style.display = box.checked ? "block" : "none";
          }
          box.addEventListener("change", sync);
          sync();
        });
      }

      function getCheckedValues(name) {
        return Array.from(
          document.querySelectorAll(`input[name="${name}"]:checked`),
        )
          .map(function (el) {
            return el.value;
          })
          .join(", ");
      }

      function validateADM01(payload) {
        const missing = [];

        if (!payload.date) missing.push("Date");
        if (!payload.requestor_first_name)
          missing.push("Name of Requester - First Name");
        if (!payload.requestor_last_name)
          missing.push("Name of Requester - Last Name");
        if (!payload.requestor_email) missing.push("Email of Requester");
        if (!payload.team_name) missing.push("Team Name");
        if (!payload.project_name) missing.push("Project Name");
        if (!payload.pcode) missing.push("P Code");
        if (!payload.client_first_name)
          missing.push("Client Name - First Name");
        if (!payload.client_last_name) missing.push("Client Name - Last Name");
        if (!payload.client_mobile_number) missing.push("Client Mobile Number");

        if (
          String(payload.conference_room_required || "").toLowerCase() ===
            "yes" &&
          !payload.conference_room_dates
        ) {
          missing.push("Conference Room dates");
        }

        if (document.getElementById("req_hotel").checked) {
          const h = payload.hotel_booking || {};
          if (!h.guest_name) missing.push("Hotel Booking - Guest Name");
          if (!h.check_in_date) missing.push("Hotel Booking - Check-in Date");
          if (!h.check_out_date) missing.push("Hotel Booking - Check-out Date");
          if (!h.payment_due_by) missing.push("Hotel Booking - Payment Due By");
        }

        if (document.getElementById("req_food").checked) {
          const f = payload.food_arrangements || {};
          if (!f.meal_type) missing.push("Food Arrangements - Meal Type");
          if (!f.date) missing.push("Food Arrangements - Date");
          if (!f.no_of_clients)
            missing.push("Food Arrangements - Number of Clients");
        }

        if (document.getElementById("req_vehicle").checked) {
          const v = payload.vehicle || {};
          if (!v.pickup_date) missing.push("Vehicle - Date of Pickup");
          if (!v.end_date)
            missing.push("Vehicle - Vehicle Requirement End Date");
          if (!v.no_of_visitors) missing.push("Vehicle - Number of Visitors");
          if (!v.pickup_time) missing.push("Vehicle - Pickup Time");
          if (!v.pickup_point) missing.push("Vehicle - Pickup Point");
          if (!v.place_to_visit) missing.push("Vehicle - Place to Visit");
        }

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      function submitADM01() {
        if (isSubmitting) return;
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          requestor_first_name: document.getElementById("requestor_first_name")
            .value,
          requestor_last_name: document.getElementById("requestor_last_name")
            .value,
          requestor_email: document.getElementById("requestor_email").value,
          team_name: document.getElementById("team_name").value,
          project_name: document.getElementById("project_name").value,
          pcode: document.getElementById("pcode").value,
          client_first_name: document.getElementById("client_first_name").value,
          client_last_name: document.getElementById("client_last_name").value,
          client_mobile_code:
            document.getElementById("client_mobile_code").value,
          client_mobile_number: document.getElementById("client_mobile_number")
            .value,
          date_of_arrival: document.getElementById("date_of_arrival").value,
          date_of_departure: document.getElementById("date_of_departure").value,
          no_of_persons_visiting: document.getElementById(
            "no_of_persons_visiting",
          ).value,
          purpose_of_visit: document.getElementById("purpose_of_visit").value,
          conference_room_required: document.getElementById(
            "conference_room_required",
          ).value,
          conference_room_dates: document.getElementById(
            "conference_room_dates",
          ).value,
          requirements: getCheckedValues("requirements"),
          hotel_booking: document.getElementById("req_hotel").checked
            ? {
                guest_name: document.getElementById("hotel_guest_name").value,
                check_in_date: document.getElementById("hotel_check_in_date")
                  .value,
                check_out_date: document.getElementById("hotel_check_out_date")
                  .value,
                payment_due_by: document.getElementById("hotel_payment_due_by")
                  .value,
              }
            : null,
          food_arrangements: document.getElementById("req_food").checked
            ? {
                meal_type: document.getElementById("food_meal_type").value,
                date: document.getElementById("food_date").value,
                no_of_clients:
                  document.getElementById("food_no_of_clients").value,
              }
            : null,
          vehicle: document.getElementById("req_vehicle").checked
            ? {
                pickup_date: document.getElementById("vehicle_pickup_date")
                  .value,
                end_date: document.getElementById("vehicle_end_date").value,
                no_of_visitors: document.getElementById(
                  "vehicle_no_of_visitors",
                ).value,
                pickup_time: document.getElementById("vehicle_pickup_time")
                  .value,
                pickup_point: document.getElementById("vehicle_pickup_point")
                  .value,
                place_to_visit: document.getElementById(
                  "vehicle_place_to_visit",
                ).value,
                other_details: document.getElementById("vehicle_other_details")
                  .value,
              }
            : null,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateADM01(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING");
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitADM01(payload);
      }
    </script>
  </body>
