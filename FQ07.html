              Forest</label

            <label class="form-col-choice"
              ><input type="radio" name="buffer_zone_type" value="Non Forest" />
              Non Forest</label
            >
            <label class="form-col-choice"
              ><input type="radio" name="buffer_zone_type" value="Village" />
              Village</label
            >
            <label class="form-col-choice"
              ><input type="radio" name="buffer_zone_type" value="Building" />
              Building</label
            >
            <label class="form-col-choice"
              ><input
                type="radio"
                name="buffer_zone_type"
                value="Agriculture"
              />

              ><input

      <button
        class="btn-primary"
        type="button"

      >
        Submit

    </div>

    <script>
      let isSubmitting = false;

      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
        const wrap = document.getElementById("arch-rows");
        wrap.appendChild(createArchRow());
        document
          .getElementById("add-arch-row")
          .addEventListener("click", function () {
            wrap.appendChild(createArchRow());
          });
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
            fillSelect(
              document.getElementById("country"),
              data.country || ["India"],
              "Select",
            );
            fillSelect(
              document.getElementById("category"),
              data.category || ["A", "B1", "B2"],
              "Select",
            );
            fillSelect(
              document.getElementById("eac_name"),
              data.eac || [],
              "Select",
            );
            fillMultiSelect(
              document.getElementById("sector"),
              data.sector || [],
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);
        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function fillMultiSelect(select, items) {
        if (!select) return;
        select.innerHTML = "";
        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function createArchRow() {
        const row = document.createElement("div");
        row.className = "subform-card";
        row.innerHTML = `
          <div class="form-row">
            <div class="form-col">
              <label class="form-label">Name</label>
              <input type="text" class="arch-name" />
            </div>
            <div class="form-col">
              <label class="form-label">Distance from project site</label>
              <input type="text" class="arch-distance" />
            </div>
          </div>
          <button type="button" class="btn-secondary arch-remove" style="margin-top:10px;">Remove</button>
        `;
        row
          .querySelector(".arch-remove")
          .addEventListener("click", function () {
            row.remove();
          });
        return row;
      }

      function collectArchRows() {
        return Array.from(document.querySelectorAll("#arch-rows .subform-card"))
          .map(function (row) {
            return {
              name: row.querySelector(".arch-name")?.value || "",
              distance_from_project_site:
                row.querySelector(".arch-distance")?.value || "",
            };
          })
          .filter(function (r) {
            return (
              String(r.name).trim() ||
              String(r.distance_from_project_site).trim()
            );
          });
      }

      function getSelectedMultiValues(id) {
        const el = document.getElementById(id);
        return Array.from(el.selectedOptions)
          .map((opt) => opt.value)
          .join(", ");
      }

      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      function validateFQ07(p) {
        const missing = [];
        if (!p.requestor_email) missing.push("Official Email ID of Requestor");
        if (!p.team_name) missing.push("Team Name");
        if (!p.project_name) missing.push("Name of the project");
        if (!p.pcode) missing.push("PCODE");
        if (!p.type_of_project) missing.push("Type of Project");
        if (!p.fae_report_link) missing.push("FAE report link");

        (p.archaeological_details || []).forEach(function (r, i) {
          if (
            String(r.name || "").trim() ||
            String(r.distance_from_project_site || "").trim()
          ) {
            if (!String(r.name || "").trim())
              missing.push(
                `Archeological or important buildings - Name (row ${i + 1})`,
              );
            if (!String(r.distance_from_project_site || "").trim())
              missing.push(
                `Archeological or important buildings - Distance from project site (row ${i + 1})`,
              );
          }
        });

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      function submitFQ07() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          requestor_first_name: document.getElementById("requestor_first_name")
            .value,
          requestor_last_name: document.getElementById("requestor_last_name")
            .value,
          requestor_email: document.getElementById("requestor_email").value,
          team_name: document.getElementById("team_name").value,
          company_name: document.getElementById("company_name").value,
          project_name: document.getElementById("project_name").value,
          pcode: document.getElementById("pcode").value,
          address_line1: document.getElementById("address_line1").value,
          address_line2: document.getElementById("address_line2").value,
          city: document.getElementById("city").value,
          state: document.getElementById("state").value,
          postal_code: document.getElementById("postal_code").value,
          country: document.getElementById("country").value,
          type_of_project: document.getElementById("type_of_project").value,
          physical_features: document.getElementById("physical_features").value,
          core_zone_type: getRadioValue("core_zone_type"),
          buffer_zone_type: getRadioValue("buffer_zone_type"),
          archaeological_details: collectArchRows(),
          project_area: document.getElementById("project_area").value,
          build_up_area: document.getElementById("build_up_area").value,
          mine_area: document.getElementById("mine_area").value,
          dump_area: document.getElementById("dump_area").value,
          plantation_area: document.getElementById("plantation_area").value,
          road_area: document.getElementById("road_area").value,
          open_area: document.getElementById("open_area").value,
          other_details: document.getElementById("other_details").value,
          environmentally_sensitive_area: document.getElementById(
            "environmentally_sensitive_area",
          ).value,
          core_zone_distance:
            document.getElementById("core_zone_distance").value,
          buffer_zone_distance: document.getElementById("buffer_zone_distance")
            .value,
          category: document.getElementById("category").value,
          sector: getSelectedMultiValues("sector"),
          eac_name: document.getElementById("eac_name").value,
          fae_report_link: document.getElementById("fae_report_link").value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateFQ07(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitFQ07(payload);
      }
    </script>
  </body>
</html>
