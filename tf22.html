<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TF22</title>
    <?!= HtmlService.createHtmlOutputFromFile('shared-styles').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">TF22</div>
      <div class="form-subtitle">
        Information to Account section wrt submission/closure of project
      </div>

      <div class="form-section">
        <div class="form-group">
          <label class="form-label" for="date">Date</label>
          <input type="date" id="date" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label">Name</label>
          <div class="form-row">
            <div class="form-col">
              <input
                type="text"
                id="employee_first_name"
                placeholder="First Name"
              />
              <div class="helper-text">First Name</div>
            </div>
            <div class="form-col">
              <input
                type="text"
                id="employee_last_name"
                placeholder="Last Name"
              />
              <div class="helper-text">Last Name</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="employee_email"
            >Employee Email ID <span class="required">*</span></label
          >
          <input type="email" id="employee_email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="team_name">Team</label>
          <select id="team_name"></select>
        </div>

        <div class="form-group">
          <label class="form-label">Type of Work</label>
          <div class="form-row">
            <div class="form-col-choice">
              <input
                type="radio"
                name="type_of_work"
                id="work_submission"
                value="Submission / Grant"
              />
              <label for="work_submission">Submission / Grant</label>
            </div>
            <div class="form-col-choice">
              <input
                type="radio"
                name="type_of_work"
                id="work_closure"
                value="Closure / Completion"
              />
              <label for="work_closure">Closure / Completion</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="project_name"
            >1, Project Name <span class="required">*</span></label
          >
          <input type="text" id="project_name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="date_of_completion"
            >Date of completion of project
            <span class="required">*</span></label
          >
          <input type="date" id="date_of_completion" required />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="project_code"
            >2, Project Code <span class="required">*</span></label
          >
          <input type="text" id="project_code" required />
          <div class="helper-text">
            Refer the active PCODE list used in your database
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="type_of_service"
            >Type of Service <span class="required">*</span></label
          >
          <select id="type_of_service" required></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="attachments_url"
            >Any other Attachment(s)</label
          >
          <input
            type="url"
            id="attachments_url"
            placeholder="Paste file URL here"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="remarks">Remarks</label>
          <textarea id="remarks"></textarea>
        </div>
      </div>

      <button
        class="btn-primary"
        type="button"
        onclick="submitTF22()"
        id="submitBtn"
      >
        Submit
      </button>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
            fillSelect(
              document.getElementById("type_of_service"),
              data.tf22ServiceTypes || [],
              "Select",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";

        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function getCheckedValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      function validateTF22(payload) {
        const missing = [];
        if (!payload.employee_email) missing.push("Employee Email ID");
        if (!payload.team_name) missing.push("Team");
        if (!payload.type_of_work) missing.push("Type of Work");
        if (!payload.project_name) missing.push("Project Name");
        if (!payload.date_of_completion)
          missing.push("Date of completion of project");
        if (!payload.project_code) missing.push("Project Code");
        if (!payload.type_of_service) missing.push("Type of Service");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      function submitTF22() {
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing... Please wait";
        submitBtn.style.backgroundColor = "#8f4a3f";

        setTimeout(function () {
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          submitBtn.style.backgroundColor = "";
        }, 15000);

        const payload = {
          date: document.getElementById("date").value,
          employee_first_name: document.getElementById("employee_first_name")
            .value,
          employee_last_name:
            document.getElementById("employee_last_name").value,
          employee_email: document.getElementById("employee_email").value,
          team_name: document.getElementById("team_name").value,
          type_of_work: getCheckedValue("type_of_work"),
          project_name: document.getElementById("project_name").value,
          date_of_completion:
            document.getElementById("date_of_completion").value,
          project_code: document.getElementById("project_code").value,
          type_of_service: document.getElementById("type_of_service").value,
          attachments_url: document.getElementById("attachments_url").value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateTF22(payload)) return;

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
          })
          .submitTF22(payload);
      }
    </script>
  </body>
</html>
