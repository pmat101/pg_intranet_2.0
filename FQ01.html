<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FQ01</title>
    <?!= HtmlService.createHtmlOutputFromFile('shared-styles').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">FQ01</div>
      <div class="form-subtitle">FAE reports Questionnaire - AQ</div>

      <div class="form-section">
        <div class="form-group">
          <label class="form-label" for="date">Date</label>
          <input type="date" id="date" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label">Name of Requestor</label>
          <div class="form-row">
            <div class="form-col">
              <input
                type="text"
                id="requestor_first_name"
                placeholder="First Name"
              />
              <div class="helper-text">First Name</div>
            </div>
            <div class="form-col">
              <input
                type="text"
                id="requestor_last_name"
                placeholder="Last Name"
              />
              <div class="helper-text">Last Name</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="requestor_email"
            >Official Email ID of Requestor
            <span class="required">*</span></label
          >
          <input type="email" id="requestor_email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="team_name"
            >Team Name <span class="required">*</span></label
          >
          <select id="team_name" required></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="company_name">Company Name</label>
          <input type="text" id="company_name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="project_name"
            >Name of the project</label
          >
          <input type="text" id="project_name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="pcode"
            >PCODE <span class="required">*</span></label
          >
          <input type="text" id="pcode" required />
          <div class="helper-text">
            Refer the active PCODE list in your database
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="category">Category</label>
          <select id="category"></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="sector">Sector</label>
          <select id="sector"></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="eac_name">EAC Name</label>
          <select id="eac_name"></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="aq_questionnaire_sheet_link"
            >AQ Questionnaire sheet link <span class="required">*</span></label
          >
          <input type="url" id="aq_questionnaire_sheet_link" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="remarks">Remarks</label>
          <textarea id="remarks"></textarea>
        </div>
      </div>

      <button
        class="btn-primary"
        type="button"
        id="submitBtn"
        onclick="submitFQ01()"
      >
        Submit
      </button>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
            fillSelect(
              document.getElementById("category"),
              data.category || [],
              "Select",
            );
            fillSelect(
              document.getElementById("sector"),
              data.sector || [],
              "Select",
            );
            fillSelect(
              document.getElementById("eac_name"),
              data.eac || [],
              "Select",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function validateFQ01(p) {
        const missing = [];
        if (!p.requestor_email) missing.push("Official Email ID of Requestor");
        if (!p.team_name) missing.push("Team Name");
        if (!p.pcode) missing.push("PCODE");
        if (!p.aq_questionnaire_sheet_link)
          missing.push("AQ Questionnaire sheet link");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      let isSubmitting = false;

      function submitFQ01() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          requestor_first_name: document.getElementById("requestor_first_name")
            .value,
          requestor_last_name: document.getElementById("requestor_last_name")
            .value,
          requestor_email: document.getElementById("requestor_email").value,
          team_name: document.getElementById("team_name").value,
          company_name: document.getElementById("company_name").value,
          project_name: document.getElementById("project_name").value,
          pcode: document.getElementById("pcode").value,
          category: document.getElementById("category").value,
          sector: document.getElementById("sector").value,
          eac_name: document.getElementById("eac_name").value,
          aq_questionnaire_sheet_link: document.getElementById(
            "aq_questionnaire_sheet_link",
          ).value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateFQ01(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitFQ01(payload);
      }
    </script>
  </body>
</html>
