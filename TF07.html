<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TF07</title>
    <?!= HtmlService.createHtmlOutputFromFile('shared-styles').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">TF07</div>
      <div class="form-subtitle">Technical Format for Accounts Information</div>

      <div class="form-section">
        <div class="form-group">
          <label class="form-label" for="date">Date</label>
          <input type="date" id="date" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label">Name</label>
          <div class="form-row">
            <div class="form-col">
              <input
                type="text"
                id="employee_first_name"
                placeholder="First Name"
              />
              <div class="helper-text">First Name</div>
            </div>
            <div class="form-col">
              <input
                type="text"
                id="employee_last_name"
                placeholder="Last Name"
              />
              <div class="helper-text">Last Name</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="employee_email"
            >Employee Email ID <span class="required">*</span></label
          >
          <input type="email" id="employee_email" required />
          <div class="helper-text">Email ID of the person filling the form</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="team_name"
            >Team Name <span class="required">*</span></label
          >
          <select id="team_name" required></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="project_name">Project Name</label>
          <input type="text" id="project_name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="project_code"
            >Project Code <span class="required">*</span></label
          >
          <input type="text" id="project_code" required />
          <div class="helper-text">
            Refer the active PCODE list used in your database
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="type_of_work">Type of Work</label>
          <select id="type_of_work">
            <option value="new_project">New Project</option>
            <option value="eia">EIA</option>
            <option value="expansion">Expansion</option>
            <option value="tor">TOR</option>
            <option value="ammendment">Amendment</option>
            <option value="modernization">Modernization</option>
            <option value="ec_violation">EC under Violation</option>
            <option value="transfer">Transfer of EC</option>
            <option value="other">Others</option>
          </select>
          <div
            id="type_of_work_other_wrap"
            style="display: none; margin-top: 10px"
          >
            <input
              type="text"
              id="type_of_work_other"
              placeholder="If Others, pls specify"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="milestone_achieved"
            >Milestone Achieved</label
          >
          <select id="milestone_achieved"></select>
          <div
            id="milestone_achieved_other_wrap"
            style="display: none; margin-top: 10px"
          >
            <input
              type="text"
              id="milestone_achieved_other"
              placeholder="If others, pls specify"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="date_of_milestone_achieved"
            >5, Date of Milestone achieved</label
          >
          <input type="date" id="date_of_milestone_achieved" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="proof_link"
            >6, Link to Screenshot or Proof of Achieving Milestone</label
          >
          <textarea id="proof_link"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label"
            >Submission Status <span class="required">*</span></label
          >
          <div class="form-row">
            <div class="form-col-choice">
              <input
                type="radio"
                id="status_new"
                name="submission_status"
                value="New"
              />
              <label for="status_new">New</label>
            </div>
            <div class="form-col-choice">
              <input
                type="radio"
                id="status_revised"
                name="submission_status"
                value="Revised"
              />
              <label for="status_revised">Revised</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="person_to_bill"
            >Person to Bill <span class="required">*</span></label
          >
          <input type="text" id="person_to_bill" required />
          <div class="helper-text">Client Contact Name</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email_of_person_to_bill"
            >Email ID of Person to Bill <span class="required">*</span></label
          >
          <input type="email" id="email_of_person_to_bill" required />
          <div class="helper-text">Client Contact Email ID</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="remarks">Remarks, if any</label>
          <textarea id="remarks"></textarea>
        </div>
      </div>

      <button
        class="btn-primary"
        type="button"
        onclick="submitTF07()"
        id="submitBtn"
      >
        Submit
      </button>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
        bindEvents();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
            fillSelect(
              document.getElementById("milestone_achieved"),
              data.milestones || [],
              "Select",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function bindOther(selectId, wrapId, inputId) {
        const select = document.getElementById(selectId);
        const wrap = document.getElementById(wrapId);
        const input = document.getElementById(inputId);

        function sync() {
          const show = String(select.value || "").toLowerCase() === "other";
          wrap.style.display = show ? "block" : "none";
          if (!show) input.value = "";
        }

        select.addEventListener("change", sync);
        sync();
      }

      function bindEvents() {
        bindOther(
          "type_of_work",
          "type_of_work_other_wrap",
          "type_of_work_other",
        );
        bindOther(
          "milestone_achieved",
          "milestone_achieved_other_wrap",
          "milestone_achieved_other",
        );
      }

      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      function validateTF07(p) {
        const missing = [];
        if (!p.employee_email) missing.push("Employee Email ID");
        if (!p.team_name) missing.push("Team Name");
        if (!p.project_code) missing.push("Project Code");
        if (!p.submission_status) missing.push("Submission Status");
        if (!p.person_to_bill) missing.push("Person to Bill");
        if (!p.email_of_person_to_bill)
          missing.push("Email ID of Person to Bill");

        if (p.type_of_work === "Other" && !p.type_of_work_other)
          missing.push("Type of Work specify");
        if (p.milestone_achieved === "Other" && !p.milestone_achieved_other)
          missing.push("Milestone Achieved specify");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      let isSubmitting = false;

      function submitTF07() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          employee_first_name: document.getElementById("employee_first_name")
            .value,
          employee_last_name:
            document.getElementById("employee_last_name").value,
          employee_email: document.getElementById("employee_email").value,
          team_name: document.getElementById("team_name").value,
          project_name: document.getElementById("project_name").value,
          project_code: document.getElementById("project_code").value,
          type_of_work: document.getElementById("type_of_work").value,
          type_of_work_other:
            document.getElementById("type_of_work_other").value,
          milestone_achieved:
            document.getElementById("milestone_achieved").value,
          milestone_achieved_other: document.getElementById(
            "milestone_achieved_other",
          ).value,
          date_of_milestone_achieved: document.getElementById(
            "date_of_milestone_achieved",
          ).value,
          proof_link: document.getElementById("proof_link").value,
          submission_status: getRadioValue("submission_status"),
          person_to_bill: document.getElementById("person_to_bill").value,
          email_of_person_to_bill: document.getElementById(
            "email_of_person_to_bill",
          ).value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateTF07(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitTF07(payload);
      }
    </script>
  </body>
</html>
