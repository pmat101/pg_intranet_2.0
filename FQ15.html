<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FQ15</title>
    <?!= HtmlService.createHtmlOutputFromFile('shared-styles').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">FQ15</div>
      <div class="form-subtitle">CBA information sheet</div>

      <div class="form-section">
        <div class="form-group">
          <label class="form-label">Name of Requestor</label>
          <div class="form-row">
            <div class="form-col">
              <input
                type="text"
                id="requestor_first_name"
                placeholder="First Name"
              />
              <div class="helper-text">First Name</div>
            </div>
            <div class="form-col">
              <input
                type="text"
                id="requestor_last_name"
                placeholder="Last Name"
              />
              <div class="helper-text">Last Name</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label"
            >Official Email ID of Requestor
            <span class="required">*</span></label
          >
          <input type="email" id="requestor_email" required />
        </div>

        <div class="form-group">
          <label class="form-label"
            >Team Name <span class="required">*</span></label
          >
          <select id="team_name" required></select>
        </div>

        <div class="form-group">
          <label class="form-label"
            >Company Name <span class="required">*</span></label
          >
          <input type="text" id="company_name" required />
        </div>

        <div class="form-group">
          <label class="form-label"
            >PCODE <span class="required">*</span></label
          >
          <input type="text" id="pcode" required />
          <div class="helper-text">
            Refer the active PCODE list in your database
          </div>
        </div>

        <div class="form-group">
          <label class="form-label"
            >Name of the project <span class="required">*</span></label
          >
          <input type="text" id="project_name" required />
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="category"></select>
        </div>

        <div class="form-group">
          <label class="form-label">Sector</label>
          <select id="sector" multiple size="8"></select>
          <div class="helper-text">Hold Ctrl/Cmd to select multiple</div>
        </div>

        <div class="form-group">
          <label class="form-label">EAC Name</label>
          <select id="eac_name"></select>
        </div>

        <div class="form-group">
          <label class="form-label"
            >CBA sheet link <span class="required">*</span></label
          >
          <input type="url" id="cba_sheet_link" required />
        </div>

        <div class="form-group">
          <label class="form-label"
            >Expected Target Date <span class="required">*</span></label
          >
          <input type="date" id="expected_target_date" required />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label">Remarks</label>
          <textarea id="remarks"></textarea>
        </div>
      </div>

      <button
        class="btn-primary"
        type="button"
        id="submitBtn"
        onclick="submitFQ15()"
      >
        Submit
      </button>
    </div>

    <script>
      let isSubmitting = false;

      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
            fillSelect(
              document.getElementById("category"),
              data.category || ["A", "B1", "B2"],
              "Select",
            );
            fillSelect(
              document.getElementById("eac_name"),
              data.eac || [],
              "Select",
            );
            fillMultiSelect(
              document.getElementById("sector"),
              data.sector || [],
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);
        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function fillMultiSelect(select, items) {
        if (!select) return;
        select.innerHTML = "";
        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function getSelectedMultiValues(id) {
        const el = document.getElementById(id);
        return Array.from(el.selectedOptions)
          .map((opt) => opt.value)
          .join(", ");
      }

      function validateFQ15(p) {
        const missing = [];
        if (!p.requestor_email) missing.push("Official Email ID of Requestor");
        if (!p.team_name) missing.push("Team Name");
        if (!p.company_name) missing.push("Company Name");
        if (!p.project_name) missing.push("Name of the project");
        if (!p.pcode) missing.push("PCODE");
        if (!p.eac_name) missing.push("EAC Name");
        if (!p.cba_sheet_link) missing.push("CBA sheet link");
        if (!p.expected_target_date) missing.push("Expected Target Date");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      function submitFQ15() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          requestor_first_name: document.getElementById("requestor_first_name")
            .value,
          requestor_last_name: document.getElementById("requestor_last_name")
            .value,
          requestor_email: document.getElementById("requestor_email").value,
          team_name: document.getElementById("team_name").value,
          company_name: document.getElementById("company_name").value,
          pcode: document.getElementById("pcode").value,
          project_name: document.getElementById("project_name").value,
          category: document.getElementById("category").value,
          sector: getSelectedMultiValues("sector"),
          eac_name: document.getElementById("eac_name").value,
          cba_sheet_link: document.getElementById("cba_sheet_link").value,
          expected_target_date: document.getElementById("expected_target_date")
            .value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateFQ15(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitFQ15(payload);
      }
    </script>
  </body>
</html>
