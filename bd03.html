    <script>
      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};

            fillSelect(
              document.getElementById("team"),
              data.team || [],
              "Select",
            );
            fillSelect(
              document.getElementById("csuite_officer_name"),
              data.csuite || [],
              "Select",
            );
            fillSelect(
              document.getElementById("eia_coordinator_name"),
              data.eiaCoordinator || [],
              "Select",
            );
            fillSelect(
              document.getElementById("project_location_country"),
              data.country || [],
              "Select",
            );

            fillSelect(
              document.getElementById("type_of_work"),
              data.workType || [],
              "Select",
            );
            fillSelect(
              document.getElementById("category"),
              data.category || [],
              "Select",
            );
            fillSelect(
              document.getElementById("service_type_code_nabet_sector"),
              data.sector || [],
              "Select",
            );
            fillSelect(
              document.getElementById("baseline_season"),
              data.baselineSeason || [],
              "Select",
            );
            fillSelect(
              document.getElementById("eac_name"),
              data.eac || [],
              "Select",
            );
            fillSelect(
              document.getElementById("pg_company"),
              data.pgCompany || [],
              "Select",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";

        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function bindOtherToggle(selectId, wrapId, inputId) {
        const select = document.getElementById(selectId);
        const wrap = document.getElementById(wrapId);
        const input = document.getElementById(inputId);

        function sync() {
          const show =
            String(select.value || "").toLowerCase() === "other" ||
            String(select.value || "").toLowerCase() === "others";
          wrap.style.display = show ? "block" : "none";
          if (!show) input.value = "";
        }

        select.addEventListener("change", sync);
        sync();
      }

      function getRadioValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      function makeKey(prefix) {
        return (
          prefix +
          "_" +
          Date.now().toString(36) +
          "_" +
          Math.random().toString(36).slice(2, 8)
        );
      }

      function createOtherPersonRow() {
        const row = document.createElement("div");
        row.className = "other-person-row";
        row.innerHTML = `
          <input type="hidden" class="row-key" value="${makeKey("OP")}">
          <div class="form-row">
            <div class="form-col"><input type="text" class="op-name" placeholder="Name"></div>
            <div class="form-col"><input type="email" class="op-email" placeholder="Email"></div>
            <div class="form-col"><input type="text" class="op-purpose" placeholder="Purpose"></div>
            <div style="width:48px; display:flex; align-items:center;">
              <button type="button" class="btn-secondary remove-row">✕</button>
            </div>
          </div>
        `;
        row.querySelector(".remove-row").addEventListener("click", function () {
          row.remove();
        });
        return row;
      }

      function createMilestoneRow() {
        const row = document.createElement("div");
        row.className = "milestone-row";
        row.innerHTML = `
    <input type="hidden" class="row-key" value="${makeKey("MS")}">
    <div class="form-row">
      <div class="form-col"><input type="text" class="ms-name" placeholder="Milestone name"></div>
      <div class="form-col"><input type="text" class="ms-details" placeholder="Milestone details"></div>
      <div class="form-col"><input type="text" class="ms-timeline" placeholder="Date / timeline"></div>
      <div class="form-col"><input type="number" class="ms-billing" step="0.01" placeholder="% billing"></div>
      <div style="width:48px; display:flex; align-items:center;">
        <button type="button" class="btn-secondary remove-row">✕</button>
      </div>
    </div>
  `;
        row.querySelector(".remove-row").addEventListener("click", function () {
          row.remove();
        });
        return row;
      }

      function bindEvents() {
        bindOtherToggle(
          "type_of_work",
          "type_of_work_other_wrap",
          "type_of_work_other_specify",
        );
        bindOtherToggle(
          "category",
          "category_other_wrap",
          "category_other_specify",
        );
        bindOtherToggle(
          "service_type_code_nabet_sector",
          "sector_other_wrap",
          "sector_other_specify",
        );
        bindOtherToggle(
          "baseline_season",
          "baseline_season_other_wrap",
          "baseline_season_other_specify",
        );
        bindOtherToggle(
          "eac_name",
          "eac_name_other_wrap",
          "eac_name_other_specify",
        );
        bindOtherToggle(
          "pg_company",
          "pg_company_other_wrap",
          "pg_company_other_specify",
        );

        document
          .getElementById("trav-other")
          .addEventListener("change", function () {
            document.getElementById(
              "travelling_borne_by_other_wrap",
            ).style.display = this.checked ? "block" : "none";
            if (!this.checked)
              document.getElementById(
                "travelling_borne_by_other_specify",
              ).value = "";
          });

        document
          .getElementById("trav-pp")
          .addEventListener("change", function () {
            if (this.checked) {
              document.getElementById(
                "travelling_borne_by_other_wrap",
              ).style.display = "none";
              document.getElementById(
                "travelling_borne_by_other_specify",
              ).value = "";
            }
          });

        document
          .getElementById("trav-perfact")
          .addEventListener("change", function () {
            if (this.checked) {
              document.getElementById(
                "travelling_borne_by_other_wrap",
              ).style.display = "none";
              document.getElementById(
                "travelling_borne_by_other_specify",
              ).value = "";
            }
          });

        document
          .getElementById("add-other-person")
          .addEventListener("click", function () {
            document
              .getElementById("other-persons-rows")
              .appendChild(createOtherPersonRow());
          });

        document
          .getElementById("add-milestone")
          .addEventListener("click", function () {
            document
              .getElementById("milestone-rows")
              .appendChild(createMilestoneRow());
          });

        // start with one row in each subform
        document.getElementById("add-other-person").click();
        document.getElementById("add-milestone").click();
      }

      function collectOtherPersonsRows() {
        return Array.from(
          document.querySelectorAll("#other-persons-rows .other-person-row"),
        )
          .map(function (row) {
            return {
              name: row.querySelector(".op-name")?.value || "",
              email: row.querySelector(".op-email")?.value || "",
              purpose: row.querySelector(".op-purpose")?.value || "",
            };
          })
          .filter(function (r) {
            return r.name || r.email || r.purpose;
          });
      }

      function collectMilestoneRows() {
        return Array.from(
          document.querySelectorAll("#milestone-rows .milestone-row"),
        )
          .map(function (row) {
            return {
              milestone_name: row.querySelector(".ms-name")?.value || "",
              milestone_details: row.querySelector(".ms-details")?.value || "",
              timeline: row.querySelector(".ms-timeline")?.value || "",
              billing_percent: row.querySelector(".ms-billing")?.value || "",
            };
          })
          .filter(function (r) {
            return (
              r.milestone_name ||
              r.milestone_details ||
              r.timeline ||
              r.billing_percent
            );
          });
      }

      function validateBD03(payload) {
        const missing = [];

        if (!payload.lead_date)
          missing.push("Date of Client's Mail/ Lead Generation");
        if (!payload.official_email) missing.push("Official Email ID");
        if (!payload.team) missing.push("Team");
        if (!payload.team_head_email) missing.push("Team Head Email ID");
        if (!payload.csuite_officer_email)
          missing.push("C-Suite Officer Email ID");
        if (!payload.customer_company)
          missing.push("Customer's Company Legal Name");
        if (!payload.client_first_name) missing.push("Client First Name");
        if (!payload.client_last_name) missing.push("Client Last Name");
        if (!payload.client_contact_code) missing.push("Client Contact Code");
        if (!payload.client_contact_number)
          missing.push("Client Contact Number");
        if (!payload.client_email) missing.push("Client Email");
        if (!payload.project_name) missing.push("Project Name");
        if (!payload.pcode) missing.push("PCode");
        if (!payload.scope_of_work) missing.push("Scope of Work");
        if (!payload.category) missing.push("Category");
        if (!payload.service_type_code_nabet_sector)
          missing.push("Service Type/ Code/ NABET Sector");
        if (!payload.baseline_season) missing.push("Baseline Season");
        if (!payload.eac_name) missing.push("EAC Name");
        if (!payload.pg_company) missing.push("Perfact Group company name");

        if (
          String(payload.type_of_work || "").toLowerCase() === "other" &&
          !payload.type_of_work_other_specify
        ) {
          missing.push("Type of Work specify");
        }
        if (
          String(payload.category || "").toLowerCase() === "others" &&
          !payload.category_other_specify
        ) {
          missing.push("Category specify");
        }
        if (
          String(payload.service_type_code_nabet_sector || "").toLowerCase() ===
            "others" &&
          !payload.sector_other_specify
        ) {
          missing.push("Sector specify");
        }
        if (
          String(payload.baseline_season || "").toLowerCase() === "others" &&
          !payload.baseline_season_other_specify
        ) {
          missing.push("Season specify");
        }
        if (
          String(payload.eac_name || "").toLowerCase() === "others" &&
          !payload.eac_name_other_specify
        ) {
          missing.push("EAC specify");
        }
        if (
          String(payload.pg_company || "").toLowerCase() === "others" &&
          !payload.pg_company_other_specify
        ) {
          missing.push("PG company specify");
        }
        if (
          String(payload.travelling_borne_by || "").toLowerCase() === "other" &&
          !payload.travelling_borne_by_other_specify
        ) {
          missing.push("Travelling specify");
        }

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }

        return true;
      }
