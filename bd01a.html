    <script>
      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
        bindLeadSourceOther();
        bindWorkTypeOther();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};

            fillSelect(
              document.getElementById("country"),
              data.country || [],
              "Select",
            );
            fillSelect(
              document.getElementById("st-ut"),
              data.stUt || [],
              "Select",
            );
            fillSelect(
              document.getElementById("work-type"),
              data.workType || [],
              "Select",
            );
            fillSelect(
              document.getElementById("sector"),
              data.sector || [],
              "Select",
            );
            fillSelect(
              document.getElementById("specs"),
              data.specs || [],
              "Select",
            );
            fillSelect(
              document.getElementById("pg-company"),
              data.pgCompany || [],
              "Select",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder, selectedValue) {
        if (!select) return;

        const keep = selectedValue !== undefined ? selectedValue : select.value;
        select.innerHTML = "";

        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          if (typeof item === "string") {
            option.value = item;
            option.textContent = item;
          } else {
            option.value = item.value;
            option.textContent = item.label || item.value;
          }
          select.appendChild(option);
        });

        if (keep) select.value = keep;
      }

      function getCheckedValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : "";
      }

      function bindLeadSourceOther() {
        const select = document.getElementById("lead-source");
        const wrap = document.getElementById("lead-source-other-wrap");
        const input = document.getElementById("lead-source-other-specify");

        function sync() {
          const show = String(select.value || "").toLowerCase() === "others";
          wrap.style.display = show ? "block" : "none";
          if (!show) input.value = "";
        }

        select.addEventListener("change", sync);
        sync();
      }

      function bindWorkTypeOther() {
        const select = document.getElementById("work-type");
        const wrap = document.getElementById("work-type-other-wrap");
        const input = document.getElementById("work-type-other-specify");

        function sync() {
          const show = String(select.value || "").toLowerCase() === "others";
          wrap.style.display = show ? "block" : "none";
          if (!show) input.value = "";
        }

        select.addEventListener("change", sync);
        sync();
      }

      function validateBD01A(payload) {
        const missing = [];

        if (!payload.leadDate)
          missing.push("Date of Client's Mail/ Lead Generation");
        if (!payload.formFillerFirstName)
          missing.push("Form filler first name");
        if (!payload.formFillerLastName) missing.push("Form filler last name");
        if (!payload.officialEmail) missing.push("Official Email ID");
        if (!payload.customerCompany)
          missing.push("Customer's Company Legal Name");
        if (!payload.customerContact) missing.push("Customer contact number");
        if (!payload.customerEmail) missing.push("Customer Email");
        if (!payload.customerEmailConfirm) missing.push("Confirm Email");
        if (!payload.isRepeatCustomer) missing.push("Repeat customer yes/no");
        if (!payload.activityProposed)
          missing.push("Type of Activity Proposed");
        if (!payload.stUt) missing.push("ST/UT");
        if (!payload.workType) missing.push("Type of Work");
        if (
          String(payload.workType || "").toLowerCase() === "others" &&
          !String(payload.workTypeOtherSpecify || "").trim()
        ) {
          missing.push("Type of Work specify");
        }
        if (!payload.specs) missing.push("Specifications");
        if (!payload.finYear) missing.push("Financial Year");
        if (!payload.pgCompany) missing.push("Perfact group company name");
        if (!payload.customerClass) missing.push("Customer Classification");
        if (!payload.leadSource) missing.push("Lead Source");
        if (
          String(payload.leadSource || "").toLowerCase() === "others" &&
          !String(payload.leadSourceOtherSpecify || "").trim()
        ) {
          missing.push("Lead Source specify");
        }

        if (
          payload.customerEmail &&
          payload.customerEmailConfirm &&
          payload.customerEmail !== payload.customerEmailConfirm
        ) {
          missing.push("Customer email and confirm email do not match");
        }

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }

        return true;
      }

      let isSubmitting = false;

      function submitBD01A() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          leadDate: document.getElementById("lead-date").value,
          formFillerFirstName: document.getElementById("form-filler-first-name")
            .value,
          formFillerLastName: document.getElementById("form-filler-last-name")
            .value,
          officialEmail: document.getElementById("official-email").value,
          customerCompany: document.getElementById("customer-company").value,
          customerFirstName: document.getElementById("customer-first-name")
            .value,
          customerLastName: document.getElementById("customer-last-name").value,
          customerContact: document.getElementById("customer-contact").value,
          customerEmail: document.getElementById("customer-email").value,
          customerEmailConfirm: document.getElementById(
            "customer-email-confirm",
          ).value,
          isRepeatCustomer: getCheckedValue("repeat"),
          activityProposed: document.getElementById("activity-proposed").value,
          village: document.getElementById("village").value,
          taluka: document.getElementById("taluka").value,
          district: document.getElementById("district").value,
          state: document.getElementById("state").value,
          postalCode: document.getElementById("postal-code").value,
          country: document.getElementById("country").value,
          stUt: document.getElementById("st-ut").value,
          workType: document.getElementById("work-type").value,
          sector: document.getElementById("sector").value,
          specs: document.getElementById("specs").value,
          finYear: document.getElementById("fin-year").value,
          pgCompany: document.getElementById("pg-company").value,
          customerClass: document.getElementById("customer-class").value,
          leadSource: document.getElementById("lead-source").value,
          rfqUrl: document.getElementById("rfq-url").value,
          remarks: document.getElementById("remarks").value,
          leadSourceOtherSpecify: document.getElementById(
            "lead-source-other-specify",
          ).value,
          workTypeOtherSpecify: document.getElementById(
            "work-type-other-specify",
          ).value,
        };

        if (!validateBD01A(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitBD01A(payload);
      }
    </script>
