<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FQ08</title>

    <?!= HtmlService.createHtmlOutputFromFile('shared-styles').getContent(); ?>

    <style>
      .section-divider {
        margin: 22px 0 14px;
        padding-top: 8px;
        border-top: 1px solid #e5e7eb;
        font-weight: 700;
        font-size: 18px;
      }
    </style>
  </head>

  <body>
    <div class="form-wrapper">
      <div class="form-title">FQ08</div>
      <div class="form-subtitle">FAE reports Questionnaire - SE</div>

      <div class="form-section">
        <!-- Date -->
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" id="date" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <!-- Requestor -->
        <div class="form-group">
          <label class="form-label">Name of Requestor</label>
          <div class="form-row">
            <div class="form-col">
              <input
                type="text"
                id="requestor_first_name"
                placeholder="First Name"
              />
            </div>
            <div class="form-col">
              <input
                type="text"
                id="requestor_last_name"
                placeholder="Last Name"
              />
            </div>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label"
            >Official Email ID of Requestor
            <span class="required">*</span></label
          >
          <input type="email" id="requestor_email" required />
        </div>

        <!-- Team -->
        <div class="form-group">
          <label class="form-label"
            >Team Name <span class="required">*</span></label
          >
          <select id="team_name" required></select>
        </div>

        <!-- Company -->
        <div class="form-group">
          <label class="form-label">Company Name</label>
          <input type="text" id="company_name" />
        </div>

        <!-- Project -->
        <div class="form-group">
          <label class="form-label"
            >Name of the project <span class="required">*</span></label
          >
          <input type="text" id="project_name" required />
        </div>

        <!-- PCODE -->
        <div class="form-group">
          <label class="form-label"
            >PCODE <span class="required">*</span></label
          >
          <input type="text" id="pcode" required />
          <div class="helper-text">Refer active PCODE sheet</div>
        </div>

        <!-- Category -->
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="category"></select>
        </div>

        <!-- Sector -->
        <div class="form-group">
          <label class="form-label">Sector</label>
          <select id="sector" multiple size="6"></select>
          <div class="helper-text">Hold Ctrl/Cmd to select multiple</div>
        </div>

        <!-- EAC -->
        <div class="form-group">
          <label class="form-label">EAC Name</label>
          <select id="eac_name"></select>
        </div>

        <!-- Type of Project -->
        <div class="form-group">
          <label class="form-label"
            >Type of Project <span class="required">*</span></label
          >
          <div class="form-row">
            <label class="form-col-choice">
              <input
                type="radio"
                name="type_of_project"
                value="Green field project"
              />
              Green field project
            </label>
            <label class="form-col-choice">
              <input
                type="radio"
                name="type_of_project"
                value="Expansion Case"
              />
              Expansion Case
            </label>
          </div>
        </div>

        <!-- Links -->
        <div class="section-divider">Documents / Links</div>

        <div class="form-group">
          <label class="form-label"
            >TOR Letter <span class="required">*</span></label
          >
          <input
            type="url"
            id="tor_letter_link"
            placeholder="Paste URL"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label"
            >KML/KMZ of Project Area <span class="required">*</span></label
          >
          <input
            type="url"
            id="kml_kmz_link"
            placeholder="Paste URL"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label"
            >Topographical or Village SE map
            <span class="required">*</span></label
          >
          <input
            type="url"
            id="topo_map_link"
            placeholder="Paste URL"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label">Chapter 2</label>
          <input type="url" id="chapter_2_link" placeholder="Paste URL" />
        </div>

        <!-- Text Areas -->
        <div class="form-group">
          <label class="form-label"
            >List of industries within the Study Area</label
          >
          <textarea id="industries_in_study_area"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label"
            >Primary SE data collected during monitoring/visit</label
          >
          <textarea id="primary_se_data"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Any other relevant information</label>
          <textarea id="other_info"></textarea>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn-primary" id="submitBtn" onclick="submitFQ08()">
        Submit
      </button>
    </div>

    <script>
      let isSubmitting = false;

      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect("team_name", data.team || []);
            fillSelect("category", data.category || ["A", "B1", "B2"]);
            fillSelect("eac_name", data.eac || []);
            fillMultiSelect("sector", data.sector || []);
          })
          .getDropdownData();
      }

      function fillSelect(id, items) {
        const el = document.getElementById(id);
        el.innerHTML = "<option value=''>Select</option>";
        items.forEach((v) => {
          const o = document.createElement("option");
          o.value = v;
          o.textContent = v;
          el.appendChild(o);
        });
      }

      function fillMultiSelect(id, items) {
        const el = document.getElementById(id);
        el.innerHTML = "";
        items.forEach((v) => {
          const o = document.createElement("option");
          o.value = v;
          o.textContent = v;
          el.appendChild(o);
        });
      }

      function getRadio(name) {
        const el = document.querySelector(`input[name="${name}"]:checked`);
        return el ? el.value : "";
      }

      function validateFQ08(payload) {
        const missing = [];
        if (!payload.requestor_email) missing.push("Email");
        if (!payload.team_name) missing.push("Team");
        if (!payload.project_name) missing.push("Project");
        if (!payload.pcode) missing.push("PCODE");
        if (!payload.type_of_project) missing.push("Type of Project");
        if (!payload.tor_letter_link) missing.push("TOR Letter");
        if (!payload.kml_kmz_link) missing.push("KML/KMZ");
        if (!payload.topo_map_link) missing.push("Topo Map");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      function submitFQ08() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: date.value,
          requestor_first_name: requestor_first_name.value,
          requestor_last_name: requestor_last_name.value,
          requestor_email: requestor_email.value,
          team_name: team_name.value,
          company_name: company_name.value,
          project_name: project_name.value,
          pcode: pcode.value,
          category: category.value,
          sector: Array.from(sector.selectedOptions)
            .map((o) => o.value)
            .join(", "),
          eac_name: eac_name.value,
          type_of_project: getRadio("type_of_project"),
          tor_letter_link: tor_letter_link.value,
          kml_kmz_link: kml_kmz_link.value,
          topo_map_link: topo_map_link.value,
          chapter_2_link: chapter_2_link.value,
          industries_in_study_area: industries_in_study_area.value,
          primary_se_data: primary_se_data.value,
          other_info: other_info.value,
        };

        if (!validateFQ08(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitFQ08(payload);
      }
    </script>
  </body>
</html>
