    <script>
      let isSubmitting = false;

      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
            fillSelect(
              document.getElementById("category"),
              data.category || ["A", "B1", "B2"],
              "Select",
            );
            fillSelect(
              document.getElementById("eac_name"),
              data.eac || [],
              "Select",
            );
            fillSelect(
              document.getElementById("country"),
              data.country || ["India"],
              "Select",
            );
            fillSelect(
              document.getElementById("type_of_work"),
              data.fq10WorkType || [],
              "Select",
            );
            fillMultiSelect(
              document.getElementById("sector"),
              data.sector || [],
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function fillMultiSelect(select, items) {
        if (!select) return;
        select.innerHTML = "";
        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function getSelectedMultiValues(id) {
        const el = document.getElementById(id);
        return Array.from(el.selectedOptions)
          .map((opt) => opt.value)
          .join(", ");
      }

      function getCheckedValues(name) {
        return Array.from(
          document.querySelectorAll(`input[name="${name}"]:checked`),
        )
          .map(function (el) {
            return el.value;
          })
          .join(", ");
      }

      function validateFQ10(p) {
        const missing = [];

        if (!p.requestor_email) missing.push("Official Email ID of Requestor");
        if (!p.team_name) missing.push("Team Name");
        if (!p.company_name) missing.push("Company Name");
        if (!p.project_name) missing.push("Name of the project");
        if (!p.pcode) missing.push("PCODE");
        if (!p.category) missing.push("Category");
        if (!p.sector) missing.push("Sector");
        if (!p.eac_name) missing.push("EAC Name");
        if (!p.type_of_work) missing.push("Type of Work");
        if (!p.layout_upload_link) missing.push("Layout Upload");
        if (!p.coordinates_upload_link) missing.push("Coordinates Upload");
        if (!p.kml_upload_link) missing.push("KML Upload");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      function submitFQ10() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          requestor_first_name: document.getElementById("requestor_first_name")
            .value,
          requestor_last_name: document.getElementById("requestor_last_name")
            .value,
          requestor_email: document.getElementById("requestor_email").value,
          team_name: document.getElementById("team_name").value,
          company_name: document.getElementById("company_name").value,
          project_name: document.getElementById("project_name").value,
          pcode: document.getElementById("pcode").value,
          category: document.getElementById("category").value,
          sector: getSelectedMultiValues("sector"),
          eac_name: document.getElementById("eac_name").value,
          type_of_work: document.getElementById("type_of_work").value,
          address_line1: document.getElementById("address_line1").value,
          address_line2: document.getElementById("address_line2").value,
          city: document.getElementById("city").value,
          state: document.getElementById("state").value,
          postal_code: document.getElementById("postal_code").value,
          country: document.getElementById("country").value,
          basic_requirements: getCheckedValues("basic_requirements"),
          layout_upload_link:
            document.getElementById("layout_upload_link").value,
          coordinates_upload_link: document.getElementById(
            "coordinates_upload_link",
          ).value,
          kml_upload_link: document.getElementById("kml_upload_link").value,
          lu_map_required: getCheckedValues("lu_map_required"),
          other_maps_required: getCheckedValues("other_maps_required"),
          sampling_maps_required: getCheckedValues("sampling_maps_required"),
          idw_maps_required: getCheckedValues("idw_maps_required"),
        };

        if (!validateFQ10(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitFQ10(payload);
      }
    </script>
