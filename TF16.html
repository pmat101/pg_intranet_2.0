<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TF16</title>
    <?!= HtmlService.createHtmlOutputFromFile('shared-styles').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">TF16</div>
      <div class="form-subtitle">Agenda Enlistment</div>

      <div class="form-section">
        <div class="form-group">
          <label class="form-label" for="date">Date</label>
          <input type="date" id="date" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label">Employee Name</label>
          <div class="form-row">
            <div class="form-col">
              <input
                type="text"
                id="employee_first_name"
                placeholder="First Name"
              />
              <div class="helper-text">First Name</div>
            </div>
            <div class="form-col">
              <input
                type="text"
                id="employee_last_name"
                placeholder="Last Name"
              />
              <div class="helper-text">Last Name</div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="employee_email"
            >Employee Email ID <span class="required">*</span></label
          >
          <input type="email" id="employee_email" required />
          <div class="helper-text">Email ID of the person filling the form</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="team_name"
            >Team Name <span class="required">*</span></label
          >
          <select id="team_name" required></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="project_name"
            >Project Name <span class="required">*</span></label
          >
          <input type="text" id="project_name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="project_code"
            >Project Code <span class="required">*</span></label
          >
          <input type="text" id="project_code" required />
          <div class="helper-text">
            Refer the active PCODE list in your project sheet
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="agenda_number"
            >Agenda Number <span class="required">*</span></label
          >
          <input type="text" id="agenda_number" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="date_of_tf06_submission"
            >Date of TF06 Submission <span class="required">*</span></label
          >
          <input type="date" id="date_of_tf06_submission" required />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="date_of_pfr_emp_eia_submission"
            >Date of PFR/EMP/EIA Submission
            <span class="required">*</span></label
          >
          <input type="date" id="date_of_pfr_emp_eia_submission" required />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="date_of_eds_raised"
            >Date of EDS raised</label
          >
          <input type="date" id="date_of_eds_raised" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="date_of_eds_submitted"
            >Date of EDS submitted</label
          >
          <input type="date" id="date_of_eds_submitted" />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="date_of_project_enlistment"
            >Date of Project Enlistment <span class="required">*</span></label
          >
          <input type="date" id="date_of_project_enlistment" required />
          <div class="helper-text">dd-MMM-yyyy</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="meeting_datetime"
            >Date-Time of the meeting</label
          >
          <input type="datetime-local" id="meeting_datetime" />
          <div class="helper-text">dd-MMM-yyyy HH:MM AM/PM</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="meeting_link">Meeting link</label>
          <input type="url" id="meeting_link" />
        </div>

        <div class="form-group">
          <label class="form-label" for="critical_points"
            >Critical points (if any)</label
          >
          <textarea id="critical_points"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="potential_attendees_perfact"
            >Potential Attendees</label
          >
          <textarea id="potential_attendees_perfact"></textarea>
          <div class="helper-text">from Perfact</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="potential_attendees_pp"
            >Potential Attendees</label
          >
          <textarea id="potential_attendees_pp"></textarea>
          <div class="helper-text">from PP</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="remarks">Remarks (if any)</label>
          <textarea id="remarks"></textarea>
        </div>
      </div>

      <button
        class="btn-primary"
        type="button"
        id="submitBtn"
        onclick="submitTF16()"
      >
        Submit
      </button>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        populateDropdowns();
      });

      function populateDropdowns() {
        google.script.run
          .withSuccessHandler(function (data) {
            data = data || {};
            fillSelect(
              document.getElementById("team_name"),
              data.team || [],
              "Select",
            );
          })
          .getDropdownData();
      }

      function fillSelect(select, items, placeholder) {
        if (!select) return;
        select.innerHTML = "";
        const first = document.createElement("option");
        first.value = "";
        first.textContent = placeholder || "Select";
        select.appendChild(first);

        (items || []).forEach(function (item) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = item;
          select.appendChild(option);
        });
      }

      function validateTF16(p) {
        const missing = [];
        if (!p.employee_email) missing.push("Employee Email ID");
        if (!p.team_name) missing.push("Team Name");
        if (!p.project_name) missing.push("Project Name");
        if (!p.project_code) missing.push("Project Code");
        if (!p.agenda_number) missing.push("Agenda Number");
        if (!p.date_of_tf06_submission) missing.push("Date of TF06 Submission");
        if (!p.date_of_pfr_emp_eia_submission)
          missing.push("Date of PFR/EMP/EIA Submission");
        if (!p.date_of_project_enlistment)
          missing.push("Date of Project Enlistment");

        if (missing.length) {
          alert("Please fill:\n\n" + missing.join("\n"));
          return false;
        }
        return true;
      }

      let isSubmitting = false;

      function submitTF16() {
        if (isSubmitting) return; // blocks double-clicks instantly
        isSubmitting = true;
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";

        const payload = {
          date: document.getElementById("date").value,
          employee_first_name: document.getElementById("employee_first_name")
            .value,
          employee_last_name:
            document.getElementById("employee_last_name").value,
          employee_email: document.getElementById("employee_email").value,
          team_name: document.getElementById("team_name").value,
          project_name: document.getElementById("project_name").value,
          project_code: document.getElementById("project_code").value,
          agenda_number: document.getElementById("agenda_number").value,
          date_of_tf06_submission: document.getElementById(
            "date_of_tf06_submission",
          ).value,
          date_of_pfr_emp_eia_submission: document.getElementById(
            "date_of_pfr_emp_eia_submission",
          ).value,
          date_of_eds_raised:
            document.getElementById("date_of_eds_raised").value,
          date_of_eds_submitted: document.getElementById(
            "date_of_eds_submitted",
          ).value,
          date_of_project_enlistment: document.getElementById(
            "date_of_project_enlistment",
          ).value,
          meeting_datetime: document.getElementById("meeting_datetime").value,
          meeting_link: document.getElementById("meeting_link").value,
          critical_points: document.getElementById("critical_points").value,
          potential_attendees_perfact: document.getElementById(
            "potential_attendees_perfact",
          ).value,
          potential_attendees_pp: document.getElementById(
            "potential_attendees_pp",
          ).value,
          remarks: document.getElementById("remarks").value,
        };

        if (!validateTF16(payload)) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit";
          return;
        }

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("SUCCESS HANDLER RUNNING"); // 👈 debug
            document.body.innerHTML = res.thankYouHtml;
          })
          .withFailureHandler(function (err) {
            alert("Submission failed: " + err.message);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
          })
          .submitTF16(payload);
      }
    </script>
  </body>
</html>
